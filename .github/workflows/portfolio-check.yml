name: portfolio-check

on:
  push:
  pull_request:

jobs:
  public-snapshot-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run public-safe smoke tests
        run: |
          pytest -q

      - name: Check for obvious private infrastructure IPs
        run: |
          if grep -RInE "([0-9]{1,3}\.){3}[0-9]{1,3}" src README.md docs .env.example tests; then
            echo "Potential numeric IP address found. Review whether it is placeholder or sensitive."
            exit 1
          fi
