[project]
name = "gpclean_submit"
version = "0.1.0"
description = "Unified Deadline submitter for Maya & Blender"
authors = [{name="Seyoung", email="example@example.com"}]
requires-python = ">=3.8"
readme = "README.md"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
= {"" = "."}

[tool.setuptools.packages.find]
where = [""]
include = ["gpclean_submit*"]
